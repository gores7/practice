<!DOCTYPE html>
<html>
<head>
    <title> Данные о студентах </title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
<font face="Dejavu serif">
    <table>
        <thead>
        <tr>
            <th> № </th>
            <th> Фамилия </th>
            <th> Имя </th>
            <th> Отчество </th>
            <th> Почта </th>
            <th> Именины </th>
        </tr>
        </thead>
        <tbody>
        {% for student in students %}
        <tr>
            <td> {{ student.id }} </td>
            <td> {{ student.lastName }} </td>
            <td> {{ student.firstName }} </td>
            <td> {{ student.patronymic }} </td>
            <td> {{ student.email }} </td>
            <td> {{ student.dateOfBirth }} </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</font>
</body>
</html>
